apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-postgres-config
  namespace: langperf
  labels:
    app: otel-postgres
    app.kubernetes.io/part-of: langperf
data:
  config.yaml: |
    receivers:
      postgresql:
        endpoint: postgres.langperf.svc.cluster.local:5432
        username: bench
        password: bench
        databases: [bench]
        collection_interval: 15s
        tls:
          insecure: true
    processors:
      resource:
        attributes:
          - key: service.name
            value: langperf-postgres
            action: upsert
    exporters:
      otlphttp/prom:
        endpoint: http://192.168.1.174:9090/api/v1/otlp
    service:
      pipelines:
        metrics:
          receivers: [postgresql]
          processors: [resource]
          exporters: [otlphttp/prom]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-postgres
  namespace: langperf
  labels:
    app: otel-postgres
    app.kubernetes.io/part-of: langperf
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-postgres
  template:
    metadata:
      labels:
        app: otel-postgres
        app.kubernetes.io/part-of: langperf
    spec:
      containers:
        - name: otelcol
          image: otel/opentelemetry-collector-contrib:0.161.0
          args: ["--config", "/conf/config.yaml"]
          ports:
            - name: http
              containerPort: 8888
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: conf
              mountPath: /conf
      volumes:
        - name: conf
          configMap:
            name: otel-postgres-config
