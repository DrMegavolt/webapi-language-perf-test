apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: langperf
  labels:
    app: postgres
    app.kubernetes.io/part-of: langperf
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: langperf
  labels:
    app: postgres
    app.kubernetes.io/part-of: langperf
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        app.kubernetes.io/part-of: langperf
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: bench
            - name: POSTGRES_PASSWORD
              value: bench
            - name: POSTGRES_DB
              value: bench
          args:
            - "-c"
            - "max_connections=200"
            - "-c"
            - "shared_buffers=768MB"
            - "-c"
            - "synchronous_commit=off"
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "bench", "-d", "bench"]
            initialDelaySeconds: 3
            periodSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: microk8s-hostpath
        resources:
          requests:
            storage: 8Gi
