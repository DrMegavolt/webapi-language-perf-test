apiVersion: batch/v1
kind: Job
metadata:
  name: seed
  namespace: langperf
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 7200
  template:
    metadata:
      labels:
        app: seed
        app.kubernetes.io/part-of: langperf
    spec:
      restartPolicy: Never
      containers:
        - name: seed
          image: postgres:16-alpine
          command:
            - psql
            - -h
            - postgres
            - -U
            - bench
            - -d
            - bench
            - -v
            - ON_ERROR_STOP=1
            - -f
            - /sql/seed.sql
          env:
            - name: PGPASSWORD
              value: bench
          volumeMounts:
            - name: sql
              mountPath: /sql
      volumes:
        - name: sql
          configMap:
            name: langperf-seed
